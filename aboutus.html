<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Our Team | Animal Partners Singapore</title>
  
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/vendor/aos/aos.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
  
  <style>
    .team-section {
      padding: 60px 0;
    }

    /* The square card outline */
    .team-item {
      background: #fff;
      border: 1px solid #eee;
      padding: 30px;
      border-radius: 0px; /* Kept square to match aaa.html style */
      transition: all 0.3s ease-in-out;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .team-item:hover {
      border-color: #ffc9a0;
      box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
    }

    /* Force the placeholder to be a perfect square */
    .img-container {
      width: 100%;
      max-width: 250px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #f0f0f0;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Style for the animal placeholder - slight variation to distinguish them */
    .animal-placeholder {
      padding: 10px;
      background-color: #fff9f5;
    }

    .team-item h4 {
      color: #924230;
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .team-item p {
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>

<body>

  <main class="main">

    <!-- Human Team -->
    <section class="team-section">
      <div class="container section-title" data-aos="fade-up">
        <h2>Advisors & Consultants</h2>
      </div>

      <div class="container">
        <div class="row gy-4">

          <div class="col-lg-4 col-md-6" data-aos="fade-up">
            <div class="team-item">
              <div class="img-container">
                <img src="assets/img/about-square.png" alt="Profile Placeholder">
              </div>
              <h4>Advisor Name</h4>
              <p>Counsellor / Consultant Specialization</p>
            </div>
          </div>

          <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="100">
            <div class="team-item">
              <div class="img-container">
                <img src="assets/img/about-square.png" alt="Profile Placeholder">
              </div>
              <h4>Advisor Name</h4>
              <p>Scientific Advisor / Research Partner</p>
            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- Animal Team -->
    <section class="team-section light-background">
      <div class="container section-title" data-aos="fade-up">
        <h2>Our Animal Partners</h2>
      </div>

      <div class="container">
        <div class="row gy-4">

          <div class="col-lg-3 col-md-6" data-aos="fade-up">
            <div class="team-item">
              <div class="img-container animal-placeholder">
                <img src="assets/img/about-square.png" alt="Animal Placeholder">
              </div>
              <h4>Animal Name</h4>
              <p>Therapy Dog / Guinea Pig / Rabbit</p>
            </div>
          </div>
          
          <!-- Repeat for other animals -->

        </div>
      </div>
    </section>

  </main>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/aos/aos.js"></script>
</body>
</html>
